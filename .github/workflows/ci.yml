name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate solution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('GymTracker.slnx', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore MAUI workloads
        run: dotnet workload restore GymTracker.slnx

      - name: Restore dependencies
        run: dotnet restore GymTracker.slnx

      - name: Run tests
        run: dotnet test GymTracker.slnx

      - name: Build Android target
        run: dotnet build src/GymTracker/GymTracker.csproj --configuration Release --framework net10.0-android --no-restore
